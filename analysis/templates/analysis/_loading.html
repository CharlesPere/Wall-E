<!-- Loading spinner: activates on any <form data-loading-seconds="..."> -->
<style>
  .sp-overlay {
    position: fixed; inset: 0; z-index: 2000;
    display: none; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, .6);
  }
  .sp-overlay.sp-show { display: flex; }
  .sp-spinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 6px solid #d4e8d0; border-top-color: #2f7a45;
    animation: sp-spin .9s linear infinite;
  }
  @keyframes sp-spin { to { transform: rotate(360deg); } }
</style>

<div class="sp-overlay" id="sp-overlay" aria-hidden="true">
  <div class="sp-spinner" role="status" aria-label="Loading"></div>
</div>

<script>
(function () {
  if (window.__spLoadingReady) return;
  window.__spLoadingReady = true;
  var overlay = document.getElementById('sp-overlay');

  document.querySelectorAll('form[data-loading]').forEach(function (form) {
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (form.dataset.spRunning) return;
      form.dataset.spRunning = '1';
      overlay.classList.add('sp-show');
      var seconds = parseFloat(form.dataset.loadingSeconds) || 3;
      setTimeout(function () { HTMLFormElement.prototype.submit.call(form); }, seconds * 1000);
    });
  });
})();
</script>
