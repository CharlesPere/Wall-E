{% extends "zone/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="content-section">
        <form method="POST"{% if not object %} data-loading="report" data-loading-seconds="2"
              data-loading-title="Generating report: {{ zone.name_zone }}"{% endif %}>
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Analysis report - {{ zone.name_zone }}</legend>
                {{ form|crispy }}
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-info" type="submit">Save</button>
                <a class="btn btn-outline-secondary" href="{% url 'zone-analysis' zone.id %}">Cancel</a>
            </div>
        </form>
    </div>
{% include "analysis/_loading.html" %}
{% endblock content %}
