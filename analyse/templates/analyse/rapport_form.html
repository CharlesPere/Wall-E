{% extends "zone/base.html" %}
{% load crispy_forms_tags %}
{% block content %}
    <div class="content-section">
        <form method="POST">
            {% csrf_token %}
            <fieldset class="form-group">
                <legend class="border-bottom mb-4">Rapport d'analyse - {{ zone.name_zone }}</legend>
                {{ form|crispy }}
            </fieldset>
            <div class="form-group">
                <button class="btn btn-outline-info" type="submit">Enregistrer</button>
                <a class="btn btn-outline-secondary" href="{% url 'zone-analyse' zone.id %}">Annuler</a>
            </div>
        </form>
    </div>
{% endblock content %}
